services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ccc
      POSTGRES_PASSWORD: ccc_frontend_dev
      POSTGRES_DB: ccc_frontend
    volumes:
      - ccc_frontend_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccc -d ccc_frontend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ccc_frontend_pg:
